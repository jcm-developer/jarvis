name = "jarvis"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ⚠️ Este fichero está en un repo PÚBLICO. Nada sensible aquí.
#
# Además, `wrangler deploy` sobrescribe [vars] con lo que haya en este fichero:
# cualquier variable que edites en el dashboard se pierde en el siguiente push.
# Este fichero es la única fuente de verdad para las vars.
#
# Los secrets funcionan al revés: `wrangler secret put` los guarda en Cloudflare
# y los deploys NO los tocan. Se ponen una vez y sobreviven a todos los pushes.
#
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put ALLOWED_TELEGRAM_IDS   # tu telegram user id, separados por coma
#   wrangler secret put OPENAI_API_KEY      # modelo y transcripción, la misma clave
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#
# ⚠️ En el dashboard, los cambios en Variables and Secrets NO se aplican hasta
#    pulsar el botón Deploy. Sin eso el Worker sigue corriendo sin ellos.
[vars]
DEFAULT_TIMEZONE = "Europe/Madrid"
LOG_LEVEL = "info"

# Proveedor de LLM. Cambiarlo son estas dos líneas más la API key correspondiente:
# el código del agente no se entera.
#
# Se empezó con NVIDIA NIM y hubo que abandonarlo: su free tier encola las
# peticiones y un saludo simple se iba por encima de los 45 s de timeout.
#
# Alternativas ya soportadas:
#   LLM_PROVIDER = "groq"    LLM_MODEL = "llama-3.3-70b-versatile"   (gratis, muy rápido)
#   LLM_PROVIDER = "nvidia"  LLM_MODEL = "meta/llama-3.3-70b-instruct"
#
# Ojo al cambiar de modelo: debe soportar tool calling o la Fase 2 deja de
# funcionar. Y en OpenAI, evita la serie "o" (razonamiento): rechaza max_tokens.
LLM_PROVIDER = "openai"
LLM_MODEL = "gpt-4o-mini"

# Mensajes de historial que se arrastran como contexto. Cuenta también los de
# herramienta (llamada + resultado), así que 30 son unos 10-12 turnos reales.
HISTORY_WINDOW = "30"

# Vueltas máximas del bucle agéntico por mensaje. Bajado de 5 a 3: cada vuelta es
# una llamada al modelo, y todas deben caber en el presupuesto de 27 s.
MAX_AGENT_ITERATIONS = "3"

# Hora LOCAL del briefing diario. La ventana de envío son 3 horas (con 8: a las 8,
# 9 o 10): si el cron se salta su disparo, el siguiente lo recupera.
BRIEFING_HOUR = "8"

# Transcripción de notas de voz.
# "openai" acepta el OGG/Opus de Telegram sin conversión y acierta más en español.
# Alternativa gratis, dentro de Cloudflare:
#   STT_PROVIDER = "workers-ai"   STT_MODEL = "@cf/openai/whisper-large-v3-turbo"
STT_PROVIDER = "openai"
STT_MODEL = "whisper-1"
STT_LANGUAGE = "es"

# Estado efímero: dedupe de update_id, confirmaciones pendientes, cuotas.
# Crear con:  npx wrangler kv namespace create STATE
# El id no es un secreto: sin credenciales de cuenta no sirve de nada.
[[kv_namespaces]]
binding = "STATE"
id = "0e41914a829c4f87897b73eca34a2760"

# Workers AI. Se usa a partir de la Fase 3 (Whisper). Declararlo ya no cuesta nada.
[ai]
binding = "AI"

[observability]
enabled = true

# Briefing y recordatorios (Fase 5). Cada cinco minutos, no cada hora: un aviso
# pedido para las 12:10 tiene que llegar a las 12:10, y con el cron en punto lo
# antes que podía salir era la hora siguiente. Son 288 invocaciones al día, nada
# frente a las 100.000 del plan free, y el briefing sigue saliendo una vez al día.
#
# Dispara EN UTC: la hora local del usuario se calcula en el código
# (src/lib/localtime.ts), porque España cambia de horario dos veces al año y un
# cron fijo se descuadraría medio año.
[triggers]
crons = ["*/5 * * * *"]
