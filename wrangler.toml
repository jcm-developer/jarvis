name = "jarvis"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ⚠️ This file lives in a PUBLIC repo. Nothing sensitive here.
#
# On top of that, `wrangler deploy` overwrites [vars] with whatever is in this file:
# any variable edited in the dashboard is lost on the next push. This file is the
# only source of truth for vars.
#
# Secrets work the other way round: `wrangler secret put` stores them in Cloudflare
# and deploys do NOT touch them. Set once, they survive every push.
#
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put ALLOWED_TELEGRAM_IDS   # your telegram user id, comma separated
#   wrangler secret put OPENAI_API_KEY      # model and transcription, the same key
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#
# Calendar (phase 6). All three come from the service account JSON and from the
# calendar's "Settings and sharing" screen:
#   wrangler secret put GOOGLE_SA_EMAIL         # client_email from the JSON
#   wrangler secret put GOOGLE_SA_PRIVATE_KEY   # private_key from the JSON, \n included
#   wrangler secret put GOOGLE_CALENDAR_ID      # the calendar's id, never "primary"
#
# Web search and page reading (phase 20). Both optional, and they fail differently:
#   wrangler secret put TAVILY_API_KEY   # tavily.com, free tier, no card
#   wrangler secret put JINA_API_KEY     # optional: raises Jina Reader's rate limit
#
# Without TAVILY_API_KEY the search_web tool is not even offered to the model and the
# prompt goes back to saying it cannot search: the assistant works exactly as before.
# JINA_API_KEY is different — Jina Reader works without a key at a lower rate limit, so
# read_url needs no secret at all.
#
# There is no SEARCH_PROVIDER var on purpose: with one provider it would be dead
# configuration, the same call as the calendar's. The interface in src/search/ is what
# makes swapping cheap, and it will need it: these free tiers move fast. Brave's was the
# obvious pick until it became metered billing with no spending cap, and Google's Custom
# Search closed to new customers.
#
# ⚠️ In the dashboard, changes under Variables and Secrets do NOT take effect until
#    the Deploy button is pressed. Until then the Worker keeps running without them.
[vars]
DEFAULT_TIMEZONE = "Europe/Madrid"
LOG_LEVEL = "info"

# LLM provider. Switching is these two lines plus the matching API key: the agent's
# code never notices.
#
# It started on NVIDIA NIM and had to be abandoned: its free tier queues requests and
# a simple greeting went past the 45 s timeout.
#
# Then came gpt-4o-mini, dropped for following instructions terribly: with the rules
# right in front of it, it duplicated tasks, dated alerts to the following day and
# titled things "Recordar X" having been forbidden to. gpt-4.1-mini costs more on
# paper ($0.40 per million input against $0.15) but barely so on what we actually
# spend: the cached prefix is $0.10 against $0.075, and it is most of the load.
#
# Alternatives already supported:
#   LLM_PROVIDER = "groq"    LLM_MODEL = "llama-3.3-70b-versatile"   (free, very fast)
#   LLM_PROVIDER = "nvidia"  LLM_MODEL = "meta/llama-3.3-70b-instruct"
#
# Careful when changing model: it must support tool calling or the whole of phase 2
# stops working. And on OpenAI, avoid the "o" (reasoning) series: it rejects max_tokens.
LLM_PROVIDER = "openai"
LLM_MODEL = "gpt-4.1-mini"

# History messages dragged along as context. Tool rows count too (call + result), so
# 30 is about 10-12 real turns.
HISTORY_WINDOW = "30"

# Maximum agentic loop rounds per message. Lowered from 5 to 3: every round is a model
# call, and all of them have to fit the 27 s budget.
MAX_AGENT_ITERATIONS = "3"

# LOCAL hour of the daily briefing. The sending window is 3 hours (with 8: at 8, 9 or
# 10): if the cron misses its tick, the next one recovers it.
BRIEFING_HOUR = "8"

# Minutes of notice for the heads-up before an appointment. 0 turns it off.
# Google Calendar sends its own notification wherever it is installed; this one arrives
# where the tasks and the chat are, which is where the answer gets written.
EVENT_ALERT_MINUTES = "15"

# The day window find_free_slots searches for gaps in, in LOCAL hours.
# Without it, "you are free from 03:00 to 07:00" would be a correct and useless answer:
# the calendar is empty at night because people sleep, not because there is room.
# DAY_END_HOUR accepts 24 to mean "until midnight".
DAY_START_HOUR = "9"
DAY_END_HOUR = "21"

# Voice note transcription.
# "openai" accepts Telegram's OGG/Opus without conversion and is more accurate in
# Spanish. Free alternative, inside Cloudflare:
#   STT_PROVIDER = "workers-ai"   STT_MODEL = "@cf/openai/whisper-large-v3-turbo"
STT_PROVIDER = "openai"
STT_MODEL = "whisper-1"
STT_LANGUAGE = "es"

# Ephemeral state: update_id dedupe, pending confirmations, quotas.
# Create it with:  npx wrangler kv namespace create STATE
# The id is not a secret: without account credentials it is useless.
[[kv_namespaces]]
binding = "STATE"
id = "0e41914a829c4f87897b73eca34a2760"

# Workers AI. Used from phase 3 on (Whisper). Declaring it costs nothing.
[ai]
binding = "AI"

[observability]
enabled = true

# Briefing and reminders (phase 5). Every five minutes, not hourly: an alert asked for
# at 12:10 has to arrive at 12:10, and with the cron on the hour the earliest it could
# go out was the following hour. That is 288 invocations a day, nothing against the free
# plan's 100,000, and the briefing still goes out once a day.
#
# It fires IN UTC: the user's local hour is computed in the code
# (src/lib/localtime.ts), because Spain changes its clocks twice a year and a fixed cron
# would be off for half of it.
[triggers]
crons = ["*/5 * * * *"]
